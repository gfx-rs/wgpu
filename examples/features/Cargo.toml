[package]
name = "wgpu-examples"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Common example code"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
publish = false

[package.metadata.cargo-machete]
# Cargo machete struggles with this dev dependency:
ignored = ["wasm_bindgen_test"]

[lib]
bench = false
harness = false
path = "src/lib.rs"

[[bin]]
name = "wgpu-examples"
path = "src/main.rs"
test = false

[dependencies]
bytemuck.workspace = true
cfg-if.workspace = true
encase = { workspace = true }
flume.workspace = true
glam = { workspace = true, features = ["bytemuck", "encase"] }
half = { workspace = true, features = ["bytemuck"] }
ktx2.workspace = true
log.workspace = true
nanorand = { workspace = true, features = ["getrandom"] }
noise.workspace = true
obj.workspace = true
png.workspace = true
pollster.workspace = true
web-time.workspace = true
winit.workspace = true

[dev-dependencies]
wgpu-test.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
wgpu = { workspace = true, features = ["trace"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
console_log.workspace = true
fern.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# We need these features in the framework examples and tests
web-sys = { workspace = true, features = [
    "Blob",
    "CanvasRenderingContext2d",
    "HtmlImageElement",
    "ImageData",
    "Location",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "WebGl2RenderingContext",
] }
wgpu = { workspace = true, default-features = false, features = [
    "std",
    "trace",
    "wgsl",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[features]
default = []
webgl = ["wgpu/webgl"]
webgpu = ["wgpu/webgpu"]

[lints.clippy]
disallowed_types = "allow"
