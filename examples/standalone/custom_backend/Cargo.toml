[package]
name = "wgpu-example-custom-backend"
edition = "2024"
rust-version = "1.87"
publish = false

[features]
default = ["web"]
web = ["wgpu/web"]

[dependencies]
wgpu = { version = "30.0.0", features = [
    "custom",
    "wgsl",
], default-features = false }
pollster = { version = "1.0", features = ["macro"] }
