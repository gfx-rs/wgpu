capabilities = "RAY_QUERY | ACCELERATION_STRUCTURE_BINDING_ARRAY"
targets = "SPIRV | HLSL"

[hlsl]
shader_model = "V6_5"
fake_missing_bindings = true
zero_initialize_workgroup_memory = true

# The unbounded array takes every register from its base upward, so it needs
# its own space to avoid overlapping the bounded array.
[[hlsl.binding_map]]
bind_target = { binding_array_size = 4, register = 0, space = 0 }
resource_binding = { group = 0, binding = 0 }

[[hlsl.binding_map]]
bind_target = { register = 0, space = 1 }
resource_binding = { group = 0, binding = 1 }

[spv]
version = [1, 4]

[[spv.binding_map]]
bind_target = { descriptor_set = 0, binding = 0, binding_array_size = 4 }
resource_binding = { group = 0, binding = 0 }

[[spv.binding_map]]
bind_target = { descriptor_set = 0, binding = 1, binding_array_size = 4 }
resource_binding = { group = 0, binding = 1 }

[[spv.binding_map]]
bind_target = { descriptor_set = 0, binding = 2 }
resource_binding = { group = 0, binding = 2 }

[[spv.binding_map]]
bind_target = { descriptor_set = 0, binding = 3 }
resource_binding = { group = 0, binding = 3 }
