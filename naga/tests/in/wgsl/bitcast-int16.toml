# No GLSL support for 16-bit integers
targets = "SPIRV | METAL | HLSL | WGSL"
capabilities = "SHADER_INT16"

[spv]
version = [1, 0]

[hlsl]
shader_model = "V6_2"
special_constants_binding = { space = 1, register = 0 }
immediates_target = { space = 0, register = 0 }
zero_initialize_workgroup_memory = true
