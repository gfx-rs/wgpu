# WGSL is omitted because the WGSL backend writes override-sized arrays without their element type.
targets = "SPIRV | GLSL | HLSL | METAL"

[msl]
fake_missing_bindings = false
lang_version = [3, 2]
spirv_cross_compatibility = false
zero_initialize_workgroup_memory = true

[msl.per_entry_point_map.main]
resources = [
    { bind_target = { buffer = 0, mutable = true }, resource_binding = { group = 0, binding = 0 } },
]
sizes_buffer = 1

[msl.per_entry_point_map.padded_only]
resources = [
    { bind_target = { buffer = 0, mutable = true }, resource_binding = { group = 0, binding = 0 } },
]
sizes_buffer = 1

[msl.per_entry_point_map.no_workgroup]
resources = [
    { bind_target = { buffer = 0, mutable = true }, resource_binding = { group = 0, binding = 0 } },
]
sizes_buffer = 1
