capabilities = "SUBGROUP"
# The SPIR-V frontend loses the uniformity of built-in inputs, which makes the
# `subgroupShuffleXor` mask non-uniform: https://github.com/gfx-rs/wgpu/issues/4317
skip_uniformity_analysis = true
targets = "METAL | GLSL | HLSL | WGSL"

[msl]
fake_missing_bindings = false
lang_version = [2, 4]
spirv_cross_compatibility = false
zero_initialize_workgroup_memory = true

[hlsl]
shader_model = "V6_0"
fake_missing_bindings = true
restrict_indexing = true
zero_initialize_workgroup_memory = true

[glsl]
version.Desktop = 430
zero_initialize_workgroup_memory = true

[spv]
version = [1, 3]
