name: CTS

on:
  pull_request:
  # Runs on `trunk` to save the build caches that pull requests read.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      benchmark:
        description: Compare macOS CTS optimization and coverage
        type: boolean
        default: false
      benchmark-cache:
        description: Cache key suffix; reuse for warm builds, change for cold builds
        type: string
        default: experiment-1

env:
  #
  # Keep in sync with ci.yml
  #

  REPO_MSRV: "1.95"
  CARGO_INCREMENTAL: false
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

  #
  # Runtime configuration
  #

  LVP_POISON_MEMORY: true # to test memory init; see docs/testing.md
  # cts_runner uses dxc by default

# Every time a PR is pushed to, cancel any previous jobs. This
# makes us behave nicer to github and get faster turnaround times
# on PRs that are pushed to multiple times in rapid succession.
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  cts:
    if: ${{ !inputs.benchmark }}
    strategy:
      fail-fast: false
      matrix:
        suite: ["API Operation", "API Validation", "Other"]
        platform: ["Windows x86_64", "Mac aarch64", "Linux x86_64"]
        include:
          # When an `include` item matches existing matrix entries, the additional items are
          # added only to the matching entries. The two lines above define the matrix, and
          # the items below attach the rest of the configuration values that apply to suites
          # and platforms.
          - suite: API Operation
            filter: "^webgpu:api,operation,"
          - suite: API Validation
            filter: "^webgpu:api,validation,"
          - suite: Other
            filter: "!^webgpu:api,operation,|^webgpu:api,validation,"

          # Windows
          - platform: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            backend: dx12
            shell: bash

          # Mac
          # Need to use `zsh` for `source <(cmd)` because it doesn't work in
          # ancient MacOS bash. `zsh` is a non-standard shell in GitHub
          # actions, so must be specified as a command string.
          - platform: Mac aarch64
            os: macos-14
            target: x86_64-apple-darwin
            backend: metal
            shell: zsh {0}

          # Linux
          - platform: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            backend: vulkan
            shell: bash

    name: ${{ matrix.suite }} ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Substitution of ${{ matrix.shell }} appears not to work in per-step configuration
        shell: ${{ matrix.shell }}

    permissions: {}

    steps:
      - name: checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Repo MSRV toolchain
        run: |
          rustup toolchain install ${{ env.REPO_MSRV }} --no-self-update --profile=minimal --target ${{ matrix.target }} --component llvm-tools
          rustup override set ${{ env.REPO_MSRV }}
          cargo -V

      - name: Install `cargo-llvm-cov`
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-llvm-cov

      - name: caching
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The version number can be incremented for cache busting.
          prefix-key: v3-rust-${{ hashFiles('cts_runner/revision.txt') }}
          env-vars: ImageVersion
          cache-directories: cts
          # Save the cache from the `other` job because it also runs the cts_runner
          # integration tests.
          save-if: ${{ github.ref == 'refs/heads/trunk' && matrix.suite == 'other' }}

      # We enable line numbers for panics, but that's it
      - name: disable debug
        shell: bash
        run: |
          mkdir -p .cargo
          cat <<EOF >> .cargo/config.toml
          [profile.dev]
          debug = "line-tables-only"
          EOF

      # Unlike regular `llvm-cov run`, which builds artifacts in `target/llvm-cov-target`,
      # `llvm-cov show-env` uses the regular target directory for artifacts. Because of this,
      # this job configures the `install-mesa` and `install-warp` actions with the regular
      # target directory, not the `llvm-cov-target` directory.
      #
      # The `GITHUB_ENV` file is not subject to shell expansion, so we need to un-escape the
      # `llvm-cov show-env` output.
      - name: Set llvm-cov environment
        shell: bash
        run: |
          cargo llvm-cov --no-cfg-coverage show-env | while read -r assignment; do
            key="${assignment%%=*}"
            eval "$assignment"
            echo "$key=${!key}" >> "$GITHUB_ENV"
          done

      - name: (Windows) Install DXC
        if: matrix.os == 'windows-2022'
        uses: $/.github/actions/install-dxc

      # Note: `target-dir` is intentionally different from other jobs.
      # See note above about `llvm-cov show-env`.
      - name: (Windows) Install WARP
        if: matrix.os == 'windows-2022'
        uses: $/.github/actions/install-warp
        with:
          target-dir: "target/debug"

      - name: (Linux) Install Mesa
        if: matrix.os == 'ubuntu-24.04'
        uses: $/.github/actions/install-mesa
        with:
          target-dir: "target/debug"

      # Some of these tests check stdout, so we explicitly set the backend
      # to avoid getting EGL messages in the output.
      - name: Test cts_runner
        if: matrix.suite == 'other'
        shell: bash
        run: |
          export LLVM_PROFILE_FILE=${{ github.workspace }}/target/wgpu-%p-%m.profraw
          export DENO_WEBGPU_BACKEND=${{ matrix.backend }}
          cargo --locked test -p cts_runner

      - name: Run CTS
        shell: bash
        run: cargo --locked xtask cts --llvm-cov --backend ${{ matrix.backend }} --filter '${{matrix.filter }}'

      - name: Generate coverage report
        id: coverage
        continue-on-error: true
        run: |
          set -e

          cargo --locked llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: steps.coverage.outcome == 'success'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    name: Mac CTS opt=${{ matrix.opt-level }} coverage=${{ matrix.coverage }}
    runs-on: macos-14
    timeout-minutes: 120
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        opt-level: [0, 1, 3]
        coverage: [false, true]
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: ${{ matrix.opt-level }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install ${{ env.REPO_MSRV }} --no-self-update --profile=minimal --component llvm-tools
          rustup override set ${{ env.REPO_MSRV }}
          rustc -Vv

      - name: Enable shared generics at opt-level 3
        if: matrix.opt-level == 3
        run: |
          echo "RUSTC_BOOTSTRAP=1" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$RUSTFLAGS -Zshare-generics=y" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        if: matrix.coverage
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-llvm-cov

      - name: Set coverage environment
        if: matrix.coverage
        run: |
          cargo llvm-cov --no-cfg-coverage show-env | while read -r assignment; do
            key="${assignment%%=*}"
            eval "$assignment"
            echo "$key=${!key}" >> "$GITHUB_ENV"
          done

      - name: Cache dependencies
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: mac-cts-benchmark-${{ inputs.benchmark-cache }}-${{ matrix.opt-level }}-${{ matrix.coverage }}
          env-vars: ImageVersion
          cache-directories: cts
          save-if: true

      - name: Record configuration
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "Optimization: $CARGO_PROFILE_DEV_OPT_LEVEL; coverage: ${{ matrix.coverage }}; cache hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Phase | Seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"

      - name: Build CTS executables
        run: |
          SECONDS=0
          cargo build --locked -p wgpu-xtask --bin wgpu-xtask
          cargo build --locked -p cts_runner --bin cts_runner
          echo "| Build | $SECONDS |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run API Operation
        run: |
          SECONDS=0
          cargo --locked xtask cts --backend metal --filter '^webgpu:api,operation,'
          echo "| API Operation | $SECONDS |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run API Validation
        run: |
          SECONDS=0
          cargo --locked xtask cts --backend metal --filter '^webgpu:api,validation,'
          echo "| API Validation | $SECONDS |" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Other
        run: |
          SECONDS=0
          cargo --locked xtask cts --backend metal --filter '!^webgpu:api,operation,|^webgpu:api,validation,'
          echo "| Other | $SECONDS |" >> "$GITHUB_STEP_SUMMARY"
