name: CTS

on:
  pull_request:
    types: [labeled, opened, synchronize]
  schedule:
    - cron: '33 2 * * *'
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: false
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  MSRV: "1.84"

jobs:
  cts:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc

          # Mac
          - name: Mac aarch64
            os: macos-14
            target: x86_64-apple-darwin

          # Linux is not working, https://github.com/gfx-rs/wgpu/issues/7751.
          # Note that there is a Mesa setup step that needs to be copied from
          # the CI job, but it doesn't seem worth duplicating the code for
          # something we won't even run.
          #- name: Linux x86_64
          #  os: ubuntu-24.04
          #  target: x86_64-unknown-linux-gnu

    name: CTS ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Install Repo MSRV toolchain
        run: |
          rustup toolchain install ${{ env.MSRV }} --no-self-update --profile=minimal --target ${{ matrix.target }}
          rustup override set ${{ env.MSRV }}
          cargo -V

      - name: caching
        uses: Swatinem/rust-cache@v2
        with:
          key: cts-b # suffix for cache busting

      # We enable line numbers for panics, but that's it
      - name: disable debug
        shell: bash
        run: |
          mkdir -p .cargo
          echo """[profile.dev]
          debug = 1" > .cargo/config.toml

      - name: run CTS
        shell: bash
        run: cargo xtask cts
