# Mergify merge queue configuration.
# Reference: https://docs.mergify.com/configuration/file-format/
#
# Pull requests enter the queue with the `@mergifyio queue` command.
# A pull request goes to the first queue rule whose `queue_conditions`
# match. Required checks and approvals come from branch protection.

merge_protections_settings:
  post_comment: false

merge_queue:
  queued_label: "queue: queued"
  dequeued_label: "queue: dequeued"
  status_comments: none
  queue_controls_comment: false

pull_request_rules:
  - name: Notify the author when Mergify removes a pull request from the queue
    conditions:
      - 'label = "queue: dequeued"'
      - queue-dequeue-reason != pr-manually-dequeued
    actions:
      comment:
        message: >-
          @{{ author }} Mergify removed this PR from the merge queue.
          Reason: `{{ queue_dequeue_reason }}`.
          See the Mergify check for details.

queue_rules:
  - name: rebase
    queue_conditions:
      - 'label = "merge: rebase"'
    merge_method: rebase
    update_method: rebase

  - name: squash
    queue_conditions:
      - '-label = "merge: rebase"'
    merge_method: squash
    update_method: rebase
    commit_message_format:
      title: inherit
      body: inherit

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
