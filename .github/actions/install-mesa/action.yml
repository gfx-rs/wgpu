name: "Install Mesa"
description: "Install Mesa"
inputs:
  # Sourced from https://archive.mesa3d.org/. Bumping this requires
  # updating the mesa build in https://github.com/gfx-rs/ci-build and creating a new release.
  version:
    default: "26.2.6"
  # Corresponds to https://github.com/gfx-rs/ci-build/releases
  ci-binary-build:
    default: "build30"
  linux-sha256:
    default: "07c24347e21d428b41a8eaa44b4d29972dd26e8ae22b4a89ca9c9d3bfb2a4927"
  windows-sha256:
    default: "b2e00615feaba45942343c265cc8c5f576142ca682c1ac6661922d4b72492877"
  target-dir:
    description: "The directory into which to install the Mesa libraries."
    default: "target/llvm-cov-target/debug"
runs:
  using: "composite"
  steps:
    - id: download
      if: runner.os == 'Linux' || runner.os == 'Windows'
      uses: $/.github/actions/download-release
      with:
        repository: ${{ runner.os == 'Linux' && 'gfx-rs/ci-build' || 'pal1000/mesa-dist-win' }}
        tag: ${{ runner.os == 'Linux' && inputs.ci-binary-build || inputs.version }}
        filename: ${{ runner.os == 'Linux' && format('mesa-{0}-linux-x86_64.tar.xz', inputs.version) || format('mesa3d-{0}-release-msvc.7z', inputs.version) }}
        sha256: ${{ runner.os == 'Linux' && inputs.linux-sha256 || inputs.windows-sha256 }}

    - name: (Linux) Install Mesa
      if: runner.os == 'Linux'
      shell: bash
      env:
        MESA_ARCHIVE: ${{ steps.download.outputs.path }}
      # NOTE: We ignore `github-env` because we trust:
      #
      # - The `cygpath` tool
      # - The `$PWD` variable
      # - The contents of the Mesa archive we download here, which we control.
      run: | # zizmor: ignore[github-env]
        set -e

        mkdir mesa
        tar xpf "$MESA_ARCHIVE" -C mesa

        # The ICD provided by the mesa build is hardcoded to the build environment.
        #
        # We write out our own ICD file to point to the mesa vulkan
        cat <<- EOF > icd.json
        {
          "ICD": {
              "api_version": "1.4.354",
              "library_arch": "64",
              "library_path": "$PWD/mesa/lib/x86_64-linux-gnu/libvulkan_lvp.so"
          },
          "file_format_version": "1.0.1"
        }
        EOF

        echo "VK_DRIVER_FILES=$PWD/icd.json" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$PWD/mesa/lib/x86_64-linux-gnu/:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
        echo "LIBGL_DRIVERS_PATH=$PWD/mesa/lib/x86_64-linux-gnu/dri" >> "$GITHUB_ENV"

    - name: (Windows) Install Mesa
      if: runner.os == 'Windows'
      shell: bash
      env:
        MESA_ARCHIVE: ${{ steps.download.outputs.path }}
        CI_BINARY_BUILD: ${{ inputs.ci-binary-build }}
        INPUTS_TARGET_DIR: ${{ inputs.target-dir }}
      # NOTE: We ignore `github-env` because we trust:
      #
      # - The `cygpath` tool
      # - The `$PWD` variable
      # - The contents of the Mesa archive we download here.
      run: | # zizmor: ignore[github-env]
        set -e

        7z.exe e "$MESA_ARCHIVE" -omesa x64/{opengl32.dll,libgallium_wgl.dll,libglapi.dll,vulkan_lvp.dll,lvp_icd.x86_64.json}

        cp -v mesa/* ${INPUTS_TARGET_DIR}/
        cp -v mesa/* ${INPUTS_TARGET_DIR}/deps

        # We need to use cygpath to convert PWD to a windows path as we're using bash.
        echo "VK_DRIVER_FILES=`cygpath --windows $PWD/mesa/lvp_icd.x86_64.json`" >> "$GITHUB_ENV"
        echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
