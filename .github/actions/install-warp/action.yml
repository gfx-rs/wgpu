name: "Install WARP"
description: "Install WARP"
inputs:
  target-dir:
    description: "The directory into which to install the WARP DLL."
    required: true
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        INPUTS_TARGET_DIR: ${{ inputs.target-dir }}
      run: |
        set -e

        cargo xtask install-warp --target-dir ${INPUTS_TARGET_DIR}
