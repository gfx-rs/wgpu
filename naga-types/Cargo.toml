[package]
name = "naga-types"
version.workspace = true
edition.workspace = true
description = "Common types for naga and wgpu"
homepage.workspace = true
repository.workspace = true
license.workspace = true

# Override the workspace's `rust-version` key. Firefox uses `cargo vendor` to
# copy the crates it actually uses out of the workspace, so it's meaningful for
# them to have less restrictive MSRVs individually than the workspace as a
# whole, if their code permits. See `../README.md` for details.
rust-version = "1.87"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[features]
serialize = ["dep:serde", "indexmap/serde"]
deserialize = ["dep:serde", "indexmap/serde"]
arbitrary = ["dep:arbitrary", "std", "indexmap/arbitrary"]
std = []

[dependencies]
arbitrary = { workspace = true, features = ["derive"], optional = true }
hashbrown.workspace = true
indexmap.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["alloc", "derive"], optional = true }
thiserror.workspace = true
